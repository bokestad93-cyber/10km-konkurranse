<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>10 km MSM Lagkonkurranse</title>
    <style>
      body {
        font-family: Arial;
        background: #f5f7fa;
        padding: 20px;
      }
      h1 {
        text-align: center;
      }
      .container {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .team {
        background: white;
        padding: 15px;
        border-radius: 10px;
        width: 260px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: 0.2s;
      }
      .winner-team {
        border: 2px solid #2ecc71;
        background: #eafaf1;
      }
      .team h2 {
        text-align: center;
      }
      .runner {
        display: flex;
        gap: 5px;
        margin-bottom: 5px;
        align-items: center;
      }
      input {
        padding: 6px;
        min-width: 0;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      input:focus {
        border-color: #3498db;
        outline: none;
      }
      .name {
        flex: 2;
      }
      .time {
        flex: 1;
      }
      button {
        margin-top: 5px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .add-btn {
        background: #4caf50;
        color: white;
      }
      .remove-btn {
        background: #e74c3c;
        color: white;
        width: 30px;
        flex-shrink: 0;
      }
      .calculate-btn {
        display: block;
        margin: 20px auto;
        background: #3498db;
        color: white;
        font-size: 16px;
      }
      .results {
        margin-top: 10px;
        font-size: 14px;
      }
      .avg {
        margin-top: 5px;
        font-weight: bold;
        text-align: center;
      }
      .bottom-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 30px;
      } /* 🔥 Vinner (fixet + responsiv størrelse) */
      .winner {
        font-size: clamp(30px, 4vw, 60px);
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
        color: black;
      }
      #leaderboard {
        margin-top: 15px;
        background: white;
        padding: 12px;
        border-radius: 10px;
        width: 260px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        font-size: 14px;
      }
      #leaderboard h3 {
        text-align: center;
        margin-bottom: 10px;
      }
      @keyframes winnerPop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      .winner.animate {
        animation: winnerPop 0.5s ease;
      }
      #confettiCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <canvas id="confettiCanvas"></canvas>
    <h1>🏃 10 km MSM Lagkonkurranse</h1>
    <div class="container">
      <div class="team" id="team1Box">
        <h2>Team Lotre</h2>
        <div id="team1"></div>
        <button class="add-btn" onclick="addRunner('team1')">+ Løper</button>
        <div id="team1Results" class="results"></div>
        <div id="team1Avg" class="avg"></div>
      </div>
      <div class="team" id="team2Box">
        <h2>Team Hystad</h2>
        <div id="team2"></div>
        <button class="add-btn" onclick="addRunner('team2')">+ Løper</button>
        <div id="team2Results" class="results"></div>
        <div id="team2Avg" class="avg"></div>
      </div>
      <div class="team" id="team3Box">
        <h2>Team Bøkestad</h2>
        <div id="team3"></div>
        <button class="add-btn" onclick="addRunner('team3')">+ Løper</button>
        <div id="team3Results" class="results"></div>
        <div id="team3Avg" class="avg"></div>
      </div>
    </div>
    <button class="calculate-btn" onclick="calculate()">Beregn</button>
    <div class="bottom-container">
      <div id="winner" class="winner"></div>
      <div id="leaderboard"></div>
    </div>
    <script src="gjennomsnittsTid.js"></script>
  </body>
</html>
